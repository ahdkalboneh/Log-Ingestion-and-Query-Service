services:
  app:
    build: .
    container_name: logs-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/logs_db}
      PORT: ${PORT:-8080}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      RETENTION_CHECK_INTERVAL_MS: ${RETENTION_CHECK_INTERVAL_MS:-3600000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    

  postgres:
    image: postgres:16
    container_name: logs-postgres
    mem_limit: 1g
    cpus: 1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-logs_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs_db"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 30s
    command: 
      - "postgres"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "shared_buffers=320MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=48MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_wal_size=8GB"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "max_connections=30"

  seed:
    image: node:22-alpine
    profiles: ["bench"]
    working_dir: /scripts
    volumes:
      - ./bench:/scripts
    environment:
      BASE_URL: http://app:8080
      SEED_COUNT: ${SEED_COUNT:-1000000}
      SEED_DAYS_BACK: ${SEED_DAYS_BACK:-29}
      SEED_BATCH: ${SEED_BATCH:-500}
      SEED_CONCURRENCY: ${SEED_CONCURRENCY:-8}
    command: node seed-via-api.mjs
    depends_on:
      postgres:
        condition: service_healthy

  k6:
    image: grafana/k6:latest
    profiles: ["bench"]
    volumes:
      - ./bench:/scripts
    environment:
      BASE_URL: http://app:8080
      SCENARIO: ${SCENARIO:-load}
      AVG_BATCH_SIZE: ${AVG_BATCH_SIZE:-100}
      MAX_VUS: ${MAX_VUS:-800}
    command: run /scripts/k6-load-test.js

volumes:
  postgres_data:
  