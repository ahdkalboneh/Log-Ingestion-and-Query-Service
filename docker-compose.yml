services:
  app:
    build: .
    container_name: logs-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/logs_db
    depends_on:
      - postgres
    cpus: 0.5
    mem_limit: 256m
    

  postgres:
    image: postgres:16
    container_name: logs-postgres
    mem_limit: 1g
    cpus: 1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  